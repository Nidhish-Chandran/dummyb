{% extends 'base.html' %}

{% block title %}Sign In — Venom Watch{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5">

                <!-- Header -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                         style="width: 48px; height: 48px; background: var(--primary-light);">
                        <i class="fa-solid fa-staff-snake" style="color: var(--primary); font-size: 1.2rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-1" style="font-size: 1.2rem; color: var(--text);">Welcome back</h3>
                    <p class="text-muted mb-0" style="font-size: 0.875rem;">Sign in to Venom Watch</p>
                </div>

                <form method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger py-2" style="font-size: 0.8125rem;">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>
                            Invalid username or password. Please try again.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label" for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control"
                               placeholder="Enter your username" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="id_password">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control"
                               placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-2">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted mb-1" style="font-size: 0.8125rem;">Don't have an account?</p>
                    <a href="{% url 'accounts:register' %}" class="fw-semibold text-decoration-none"
                       style="color: var(--primary); font-size: 0.875rem;">
                        Create an account <i class="fa-solid fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
